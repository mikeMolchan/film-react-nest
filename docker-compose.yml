services:
  database:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app

  pgadmin:
    image: dpage/pgadmin4
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "8080:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - database
    networks:
      - app

  backend:
    build: ./backend
    image: ghcr.io/mikemolchan/film-react-nest-backend:latest
    restart: unless-stopped
    env_file: .env
    depends_on:
      database:
        condition: service_healthy
    networks:
      - app

  frontend:
    build: ./frontend
    image: ghcr.io/mikemolchan/film-react-nest-frontend:latest
    restart: on-failure
    volumes:
      - frontend_dist:/usr/share/nginx/html
    networks:
      - app

  nginx:
    build: ./nginx
    image: ghcr.io/mikemolchan/film-react-nest-nginx:latest
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - frontend_dist:/usr/share/nginx/html:ro
    depends_on:
      frontend:
        condition: service_completed_successfully
      backend:
        condition: service_started
    networks:
      - app

volumes:
  postgres_data:
  pgadmin_data:
  frontend_dist:

networks:
  app: